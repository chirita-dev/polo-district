name: Keep Supabase Alive

# Runs every 3 days — comfortably inside Supabase's 7-day pause window,
# with room to spare if a run gets delayed. Can also be triggered
# manually from the Actions tab any time via "Run workflow".
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the products table (read-only, keeps the project active)
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
